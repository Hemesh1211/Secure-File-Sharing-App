{% extends 'base.html' %}{% block title %}Create account · Secure Share{% endblock %}{% block content %}<section class="card narrow"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Choose a username and a long password.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9]+"><small>3–40 letters or numbers</small></label><label>Password<input type="password" name="password" required autocomplete="new-password" minlength="12"><small>At least 12 characters</small></label><button class="primary">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
