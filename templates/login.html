{% extends "base.html" %}
{% block title %}Sign In // SecureShare{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-eyebrow">ENCRYPTED WORKSPACE</div>
      <h1 class="auth-title">Sign in to your account</h1>
      <p class="panel-subtitle" style="margin-top: 0.35rem;">
        Enter your username and password to access your encrypted files.
      </p>
    </div>

    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" required autofocus placeholder="e.g. alex_morgan">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" required placeholder="••••••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 0.5rem;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 1.25rem; text-align: center; font-size: 0.82rem; color: var(--text-secondary);">
      Don't have an account? <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
